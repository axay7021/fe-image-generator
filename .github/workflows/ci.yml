name: CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: fe-image-generator-dev

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp /home/ankit/projects/fe-image-generator-dev/.env .env

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Build
        run: npm run build
