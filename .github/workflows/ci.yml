name: CI

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: fe-image-generator-dev

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp /home/ankit/projects/fe-image-generator-dev/.env .env

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm ci

      - name: Run Lint
        run: pnpm lint

      - name: Run Build
        run: pnpm build

      - name: Restart PM2
        run: |
          pm2 restart fe-image-generator-dev
