name: Next.js CI/CD for Main Branch [Image Generator]

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: fe-image-generator-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Add Envrionemnt Variables
        run: cp /home/ankit/projects/fe-image-generator-prod/.env .env

      - name: Install Dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm lint

      - name: Build Application
        run: pnpm build

      - name: Restart Application with PM2
        run: pm2 restart fe-image-generator-prod